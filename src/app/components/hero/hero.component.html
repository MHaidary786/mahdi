<section class="hero">
  <div class="hero-content">
    <h2>Hi, I'm John Doe</h2>
    <p class="subtitle">Full Stack Developer & UI/UX Enthusiast</p>
    <p class="description">
      I build beautiful and functional web applications using modern technologies
    </p>
    <div class="cta-buttons">
      <button class="btn btn-primary" (click)="scrollToSection('contact')">
        Get In Touch
      </button>
      <button class="btn btn-secondary" (click)="scrollToSection('projects')">
        View My Work
      </button>
    </div>
    <div class="social-links">
      <a href="https://github.com" target="_blank">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://linkedin.com" target="_blank">
        <i class="fab fa-linkedin"></i>
      </a>
      <a href="https://twitter.com" target="_blank">
        <i class="fab fa-twitter"></i>
      </a>
    </div>
  </div>
  <div class="hero-image">
    <img src="assets/profile.jpg" alt="Profile">
  </div>
</section>
