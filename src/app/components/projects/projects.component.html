<section id="projects" class="projects">
  <div class="container">
    <h2 class="section-title">Featured Projects</h2>

    <div class="filters">
      <button 
        *ngFor="let filter of filters"
        [class.active]="selectedFilter === filter"
        (click)="filterProjects(filter)"
        class="filter-btn"
      >
        {{ filter }}
      </button>
    </div>

    <div class="projects-grid">
      <div *ngFor="let project of filteredProjects" class="project-card">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title">
          <div class="project-overlay">
            <a [href]="project.link" target="_blank" class="btn btn-sm">
              View Live
            </a>
            <a [href]="project.github" target="_blank" class="btn btn-sm">
              GitHub
            </a>
          </div>
        </div>
        
        <div class="project-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          
          <div class="technologies">
            <span *ngFor="let tech of project.technologies" class="tech-badge">
              {{ tech }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
